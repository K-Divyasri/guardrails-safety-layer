# GitHub Actions workflow for the Guardrails Safety Layer project.
#
# What this does: every time you push code or open a pull request, GitHub spins up
# a fresh Linux machine, installs Python and the project's dependencies, runs the 33
# pytest tests, and THEN runs the red-team suite (`python -m safeguard --redteam`).
# Both steps have to pass for the build to go green.
#
# That second step is the important one for this project. The CLI's own exit code
# is 1 if even one of the 19 documented attacks stops being handled correctly (see
# safeguard/cli.py). So if a future change to the guards weakens the injection
# detector, or someone deletes a PII pattern, or a merge accidentally disables the
# topic guard, this workflow catches it automatically and blocks the merge with a
# red X — nobody has to remember to re-run the red-team by hand.
#
# WHERE THIS FILE GOES: copy it to ".github/workflows/ci.yml" at the ROOT of your
# repo (the repo root is this project folder, ai/17-guardrails-safety-layer/, the
# one that contains safeguard/, tests/, app.py, hosting/).
# GitHub only runs workflow files that live under .github/workflows/.

# The name shown in the repo's "Actions" tab.
name: CI

# "on" decides WHEN this runs. Here: on every push, and on every pull request.
on:
  push:
  pull_request:

# A workflow is made of one or more "jobs". We have one job, called "guardrails".
jobs:
  guardrails:
    # The kind of machine to run on. ubuntu-latest is a standard, free Linux box.
    # The guards are pure Python (regex + pydantic), so they behave the same on
    # Linux as they do on your Windows laptop.
    runs-on: ubuntu-latest

    # "steps" run top to bottom on that machine.
    steps:
      # Step 1: download your repo's code onto the runner. Without this, the
      # machine is empty and there's nothing to test.
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: install Python. Pin a version so CI matches what you develop against.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Step 3: install the project's dependencies. requirements.txt is at the
      # repo root, so a bare filename is enough.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: run the 33 offline pytest tests from the repo root, which is where
      # pyproject.toml lives and where pytest expects to find the tests/ folder and
      # the safeguard package.
      - name: Run tests
        run: pytest

      # Step 5: run the red-team suite — the 19 documented attacks in redteam.py —
      # through the same guards. `python -m safeguard --redteam` prints the same
      # table you see in REDTEAM_REPORT.md and exits 1 if ANY attack is no longer
      # handled as expected. No key needed: this runs entirely on the offline
      # regex/rule guards, same as the committed report.
      - name: Run the red-team suite (ship gate)
        run: python -m safeguard --redteam
